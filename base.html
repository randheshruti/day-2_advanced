
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Flask Blog{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }
        nav {
            background: #222;
            padding: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">Home</a>
        <a href="/">Posts</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
